id = "local.auto-name"
name = "Auto-name agents"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Name each unnamed agent after its working directory"
platforms = ["linux"]

[[startup]]
command = ["bash", "auto-name.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "auto-name.sh"]
